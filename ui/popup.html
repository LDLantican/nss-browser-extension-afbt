<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ASH Helper</title>
    <link rel="stylesheet" href="common.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <!--
      The popup answers two questions, for whoever is doing the day's work: is
      this browser working the queue, and does anything need me? Everything
      that answers "why did this go wrong" — the page check, the stop switch —
      is in Settings > Troubleshooting, where there is room to read it.
    -->
    <header class="bar">
      <h1>ASH Helper</h1>
      <button type="button" class="link" id="open-settings">Settings</button>
    </header>

    <p class="notice notice--warn" id="alert" hidden></p>

    <!-- Shown only when there is no address or no worker sign-in. There is no
         point rendering a worker that cannot call the web app. -->
    <section class="panel" id="setup" hidden>
      <h2>Not connected</h2>
      <p class="field__hint" id="setup-note"></p>
      <p class="panel__actions">
        <button type="button" class="btn" id="setup-go">Open Settings</button>
      </p>
    </section>

    <main id="main" hidden>
      <p class="who" id="who"></p>

      <section class="panel worker" id="worker" hidden>
        <h2>Delivery worker</h2>

        <label class="worker__switch">
          <input type="checkbox" id="worker-processing" />
          Process ASH jobs
        </label>

        <p class="field__hint" id="worker-status" hidden></p>

        <ul class="worker__connections" id="worker-connections" hidden></ul>
      </section>
    </main>

    <footer class="foot" id="foot" hidden>
      <p>
        While Process ASH jobs is on, this browser checks for approved work every
        minute and bills it in AppFolio by itself. Import work orders from
        AppFolio's own work-order list.
      </p>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
