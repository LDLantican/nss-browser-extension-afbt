<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ASH Helper</title>
    <link rel="stylesheet" href="common.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <!--
      The popup answers two questions, for whoever is doing the day's work: is
      everything all right, and does anything need me? Everything that answers
      "why did this go wrong" — page checks, run reports, the per-step buttons —
      is in Settings > Troubleshooting, where there is room to read it.
    -->
    <header class="bar">
      <h1>ASH Helper</h1>
      <button type="button" class="link" id="open-settings">Settings</button>
    </header>

    <!-- Outside <main>, so a sign-in that lapses while the popup is open can
         still be explained above the setup panel it falls back to. -->
    <p class="notice notice--warn" id="alert" hidden></p>

    <!-- Shown only when there is nothing configured or nobody signed in. There
         is no point rendering a queue to somebody who cannot send it. -->
    <section class="panel" id="setup" hidden>
      <h2>Not connected</h2>
      <p class="field__hint" id="setup-note"></p>
      <p class="panel__actions">
        <button type="button" class="btn" id="setup-go">Open Settings</button>
      </p>
    </section>

    <main id="main" hidden>
      <p class="who" id="who"></p>

      <p class="status" id="status"></p>

      <section class="panel" id="attention" hidden>
        <h2>Needs your attention</h2>

        <ul class="jobs" id="attention-list"></ul>

        <p class="panel__actions" id="attention-actions"></p>
      </section>

      <details class="panel recent" id="recent" hidden>
        <summary id="recent-summary">Recently sent</summary>

        <ul class="jobs" id="recent-list"></ul>

        <p class="panel__actions">
          <button type="button" class="link" id="recent-clear">Clear this list</button>
        </p>
      </details>
    </main>

    <footer class="foot" id="foot" hidden>
      <p>
        <span id="auto-note">Approved work is sent to AppFolio automatically every minute.</span>
        <button type="button" class="link" id="send-now">Send now</button>
      </p>

      <!-- Only when a tab this extension opened was closed on an error that
           nobody has looked at yet. The reports carry screenshots, so they are
           read in Settings. -->
      <p class="foot__problem" id="tab-errors" hidden>
        A background task ran into a problem.
        <button type="button" class="link" id="tab-errors-view">See details</button>
      </p>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
